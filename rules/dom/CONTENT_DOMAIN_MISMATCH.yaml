title: CONTENT DOMAIN MISMATCH
description: Page content does not semantically relate to the registered domain name, suggesting impersonation of another brand or service.
date: 11/11/2024
type: dom
risk_score: 3
detection:
  page_domain_matching:
    deficient: 0.70
    detect_meta: [ og:site_name, og:title ]
    title_acronym_detection:
      min_length: 3
      acronym_deficient: 80
    generic_titles: []
    min_domain_len: 3
