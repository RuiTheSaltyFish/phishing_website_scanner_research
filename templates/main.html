<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phishing Website Scanner</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0b1326;
    --bg-card:    #131b2e;
    --bg-low:     #0f1729;
    --bg-high:    #222a3d;
    --border:     rgba(69,70,77,0.3);
    --primary:    #7bd0ff;
    --secondary:  #b9c8de;
    --tertiary:   #4edea3;
    --error:      #ffb4ab;
    --error-bg:   #93000a;
    --text:       #dae2fd;
    --muted:      #909097;
    --on-primary: #00354a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 1rem 2.5rem;
  }

  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.04em;
    color: var(--primary);
    text-transform: uppercase;
  }

  /* ── Main ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
  }

  .hero { max-width: 52rem; width: 100%; text-align: center; }

  .hero h1 {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(2.4rem, 5vw, 3.75rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin-bottom: 1.25rem;
  }

  .hero h1 span { color: var(--primary); }

  .hero p {
    color: var(--secondary);
    font-size: 1.1rem;
    line-height: 1.7;
    max-width: 36rem;
    margin: 0 auto 2.5rem;
  }

  /* ── Search bar ── */
  .search-wrap {
    background: var(--bg-low);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    padding: 0.4rem 0.4rem 0.4rem 1.25rem;
    gap: 0.75rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(123,208,255,0.04);
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .search-wrap:focus-within {
    border-color: rgba(123,208,255,0.35);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 3px rgba(123,208,255,0.08);
  }

  .search-icon { color: var(--muted); flex-shrink: 0; }

  .search-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 0;
  }

  .search-wrap input::placeholder { color: var(--muted); opacity: 0.6; }

  .btn-scan {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 0.5rem;
    padding: 0.85rem 2rem;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(123,208,255,0.18);
    position: relative;
    overflow: hidden;
  }

  .btn-scan:hover  { opacity: 0.92; }
  .btn-scan:active { transform: scale(0.97); }

  .btn-scan::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0s;
  }

  .btn-scan:hover::after {
    transform: translateX(100%);
    transition: transform 0.45s ease;
  }

  /* ── Loading screen ── */
 #loading-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 4rem 2rem;
    width: 100%;
    max-width: 52rem;
    margin: 0 auto; /* ← add this */
}

  /* htmx adds .htmx-request to the indicator while request is in flight */
  #loading-screen.htmx-request {
    display: flex;
  }

  /* hide the hero form while request is in flight */
  form.htmx-request .hero,
  .hero.htmx-request {
    display: none;
  }

  /* hide hero when loading is visible */
  body.scanning .hero-wrap {
    display: none;
  }

  .loading-orb {
    position: relative;
    width: 12rem;
    height: 12rem;
  }

  .loading-orb svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  @keyframes orb-spin {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -439.82; }
  }

  .spin-arc {
    stroke-dasharray: 110 329.82;
    animation: orb-spin 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .loading-orb-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
  }

  .loading-pulse-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse-icon 1.4s ease-in-out infinite;
  }

  @keyframes pulse-icon {
    0%, 100% { opacity: 0.5; transform: scale(0.92); }
    50%       { opacity: 1;   transform: scale(1); }
  }

  .loading-text-wrap {
    text-align: center;
  }

  .loading-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 0.4rem;
  }

  .loading-subtitle {
    font-size: 1.2rem;
    color: var(--muted);
  }

  /* animated dots after "Analyzing" */
  .loading-dots span {
    display: inline-block;
    animation: dot-blink 1.4s ease-in-out infinite;
    opacity: 0;
  }
  .loading-dots span:nth-child(1) { animation-delay: 0s; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-blink {
    0%, 80%, 100% { opacity: 0; }
    40%            { opacity: 1; }
  }

  .loading-steps {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    width: 100%;
    max-width: 22rem;
  }

  .loading-step {
    display: flex;
    align-items: center;
    gap: 1.0rem;
    font-size: 1.2rem;
    color: var(--muted);
    animation: step-cycle 4.2s ease-in-out infinite;
    opacity: 0.35;
  }

  .loading-step:nth-child(1) { animation-delay: 0s; }
  .loading-step:nth-child(2) { animation-delay: 1.4s; }
  .loading-step:nth-child(3) { animation-delay: 2.8s; }

  @keyframes step-cycle {
    0%, 100%       { opacity: 0.35; color: var(--muted); }
    10%, 28%       { opacity: 1;    color: var(--primary); }
    33%            { opacity: 0.35; color: var(--muted); }
  }

  .step-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  /* ── Footer ── */
  footer {
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem 2.5rem;
  }

  .footer-brand {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--secondary);
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* ── Animations ── */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slide-down {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  header      { animation: slide-down 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .hero h1    { animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both; }
  .hero p     { animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }
  .search-wrap{ animation: fade-up 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
  footer      { animation: fade-in 0.6s ease 0.6s both; }

  @media (max-width: 600px) {
    header { padding: 1rem 1.25rem; }
    main   { padding: 3rem 1.25rem; }
    .search-wrap { flex-wrap: wrap; }
    .btn-scan { width: 100%; justify-content: center; }
    footer { padding: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Phishing Website Scanner</span>
</header>

<!-- Loading screen — visible while HTMX request is in flight -->
<div id="loading-screen" class="htmx-indicator">
  <div class="loading-orb">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <circle cx="80" cy="80" r="70" fill="transparent"
              stroke="var(--bg-high)" stroke-width="10"/>
      <circle cx="80" cy="80" r="70" fill="transparent"
              stroke="var(--primary)" stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="439.82"
              class="spin-arc"/>
    </svg>
    <div class="loading-orb-inner">
      <div class="loading-pulse-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="loading-text-wrap">
    <p class="loading-title">
      Analyzing<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
    </p>
    <p class="loading-subtitle">Inspecting the target URL for threats</p>
  </div>

  <div class="loading-steps">
    <div class="loading-step">
      <span class="step-dot"></span>
      Fetching page &amp; resolving redirects
    </div>
    <div class="loading-step">
      <span class="step-dot"></span>
      Running URL &amp; domain rule checks
    </div>
    <div class="loading-step">
      <span class="step-dot"></span>
      Scanning DOM for anomalies
    </div>
  </div>
</div>

<!-- Main hero — hidden while request is in flight via htmx-request class on form -->
<main id="main-content">
  <div class="hero">
    <h1>Scan to <span>Analyze.</span></h1>


    <form
      method="POST"
      hx-post="/scan"
      hx-target="#main-content"
      hx-swap="outerHTML"
      hx-indicator="#loading-screen"
      onsubmit="document.getElementById('main-content').style.display='none'"
    >
      <div class="search-wrap">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input
          type="text"
          name="url"
          placeholder="Enter suspicious URL for inspection"
          aria-label="URL input"
          required
        />
        <button type="submit" class="btn-scan">
          Scan Now
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </button>
      </div>
    </form>
  </div>
</main>

<footer>
  <span class="footer-brand">Phishing Website Detection System</span>
</footer>

</body>
</html>
